spring.application.name=bengaluru-transit-connect
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

# MySQL 8 Persistent Source of Truth (credentials loaded from environment / .env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bengaluru_transit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:btc_app}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Schema is explicitly managed via sql/01_schema.sql & sql/02_views_triggers_procs.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.data.web.pageable.serialization-mode=via-dto

# JWT & CORS Configuration
app.jwt.secret=${JWT_SECRET:BengaluruTransitConnectDefaultDevJwtKeyMustBeAtLeast32BytesLong2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}