<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Animated Bengaluru Multi-Modal Network Radar">
  <defs>
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B16" />
      <stop offset="50%" stop-color="#0B192E" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A8A" stroke-width="0.8" stroke-opacity="0.32" />
    </pattern>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <path id="purpleTrack" d="M 95 270 L 235 245 L 430 185 L 560 180 L 685 165 L 820 140 L 1065 135" />
    <path id="greenTrack" d="M 305 68 L 365 120 L 430 185 L 455 255 L 470 298 L 445 348 L 430 390" />
    <path id="yellowTrack" d="M 470 298 L 545 305 L 650 315 L 775 358 L 910 388" />
    <path id="bmtcOrrTrack" d="M 650 315 Q 745 275 785 220 T 820 140" />
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="430" rx="22" fill="url(#radarBg)" stroke="#1E40AF" stroke-width="2" />
  <rect width="1200" height="430" rx="22" fill="url(#radarGrid)" />

  <!-- Top Telemetry Header Bar -->
  <rect x="24" y="20" width="1152" height="44" rx="12" fill="#0F172A" fill-opacity="0.88" stroke="#3B82F6" stroke-opacity="0.4" />
  <circle cx="48" cy="42" r="6" fill="#10B981">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="64" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#E2E8F0" letter-spacing="0.8">
    LIVE BENGALURU MULTI-MODAL TOPOLOGY  |  76 GRAPH NODES  |  15 SKYWALK HUBS  |  DIJKSTRA ENGINE ACTIVE
  </text>
  <rect x="978" y="29" width="182" height="26" rx="13" fill="#1E3A8A" />
  <text x="1069" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#93C5FD">
    MYSQL 8.x SOURCE OF TRUTH
  </text>

  <!-- Network Corridors -->
  <use href="#purpleTrack" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)" />
  <use href="#greenTrack" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)" />
  <use href="#yellowTrack" fill="none" stroke="#FACC15" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)" />
  <use href="#bmtcOrrTrack" fill="none" stroke="#38BDF8" stroke-width="5" stroke-dasharray="10 7" stroke-linecap="round" filter="url(#neonGlow)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite" />
  </use>

  <!-- Pulsing Interchange Sonar Rings -->
  <!-- Majestic -->
  <circle cx="430" cy="185" r="8" fill="none" stroke="#C4B5FD" stroke-width="2.5">
    <animate attributeName="r" values="8;28" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.95;0" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <!-- KR Puram Skywalk -->
  <circle cx="820" cy="140" r="8" fill="none" stroke="#38BDF8" stroke-width="2.5">
    <animate attributeName="r" values="8;32" dur="2.0s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2.0s" repeatCount="indefinite" />
  </circle>
  <!-- Silk Board -->
  <circle cx="650" cy="315" r="8" fill="none" stroke="#FACC15" stroke-width="2.5">
    <animate attributeName="r" values="8;28" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.95;0" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <!-- RV Road -->
  <circle cx="470" cy="298" r="7" fill="none" stroke="#34D399" stroke-width="2">
    <animate attributeName="r" values="7;24" dur="2.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0" dur="2.6s" repeatCount="indefinite" />
  </circle>

  <!-- Station Nodes & Labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">
    <circle cx="95" cy="270" r="6" fill="#A78BFA" />
    <text x="65" y="294" fill="#CBD5E1">Kengeri</text>

    <circle cx="235" cy="245" r="6" fill="#A78BFA" />
    <text x="195" y="268" fill="#CBD5E1">Mysuru Rd</text>

    <circle cx="305" cy="68" r="6" fill="#34D399" />
    <text x="235" y="64" fill="#A7F3D0">Madavara</text>

    <circle cx="365" cy="120" r="6" fill="#34D399" />
    <text x="262" y="124" fill="#CBD5E1">Yeshwanthpur</text>

    <circle cx="430" cy="185" r="9" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />
    <text x="332" y="182" font-size="13" font-weight="800" fill="#FFFFFF">Majestic Hub</text>

    <circle cx="560" cy="180" r="5.5" fill="#A78BFA" />
    <text x="532" y="203" fill="#CBD5E1">MG Road</text>

    <circle cx="685" cy="165" r="5.5" fill="#A78BFA" />
    <text x="646" y="150" fill="#CBD5E1">Indiranagar</text>

    <circle cx="820" cy="140" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
    <text x="752" y="116" font-size="13" font-weight="800" fill="#7DD3FC">KR Puram Skywalk</text>

    <circle cx="1065" cy="135" r="8" fill="#C084FC" stroke="#FFFFFF" stroke-width="2" />
    <text x="990" y="114" font-size="13" font-weight="800" fill="#E9D5FF">Whitefield (Kadugodi)</text>

    <circle cx="455" cy="255" r="5.5" fill="#34D399" />
    <text x="376" y="259" fill="#CBD5E1">Jayanagar</text>

    <circle cx="470" cy="298" r="8" fill="#FDE047" stroke="#10B981" stroke-width="3" />
    <text x="392" y="303" font-weight="800" fill="#FEF08A">RV Road</text>

    <circle cx="430" cy="390" r="6" fill="#34D399" />
    <text x="328" y="395" fill="#A7F3D0">Silk Institute</text>

    <circle cx="650" cy="315" r="9" fill="#FACC15" stroke="#38BDF8" stroke-width="3" />
    <text x="595" y="342" font-size="13" font-weight="800" fill="#FEF08A">Silk Board Hub</text>

    <text x="795" y="236" font-size="12" font-weight="800" fill="#38BDF8">BMTC 500-D ORR Express</text>

    <circle cx="775" cy="358" r="5.5" fill="#FACC15" />
    <text x="735" y="382" fill="#FDE68A">Electronic City</text>

    <circle cx="910" cy="388" r="6.5" fill="#FACC15" />
    <text x="924" y="393" fill="#FEF08A">Bommasandra</text>
  </g>

  <!-- Animated Vehicles Moving Along Corridors -->
  <!-- Purple Line Train -->
  <circle r="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3" filter="url(#neonGlow)">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#purpleTrack" />
    </animateMotion>
  </circle>

  <!-- Green Line Train -->
  <circle r="7" fill="#FFFFFF" stroke="#059669" stroke-width="3" filter="url(#neonGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#greenTrack" />
    </animateMotion>
  </circle>

  <!-- Yellow Line Train -->
  <circle r="6.5" fill="#FFFFFF" stroke="#CA8A04" stroke-width="3" filter="url(#neonGlow)">
    <animateMotion dur="5.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#yellowTrack" />
    </animateMotion>
  </circle>

  <!-- BMTC 500-D Express Bus on ORR -->
  <circle r="7.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5" filter="url(#neonGlow)">
    <animateMotion dur="3.4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#bmtcOrrTrack" />
    </animateMotion>
  </circle>

  <!-- Bottom Legend Card -->
  <g transform="translate(26, 366)">
    <rect x="0" y="0" width="290" height="44" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#334155" />
    <circle cx="20" cy="22" r="5" fill="#8B5CF6" />
    <text x="32" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Purple</text>
    <circle cx="84" cy="22" r="5" fill="#10B981" />
    <text x="96" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Green</text>
    <circle cx="146" cy="22" r="5" fill="#FACC15" />
    <text x="158" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Yellow</text>
    <circle cx="212" cy="22" r="5" fill="#38BDF8" />
    <text x="224" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">BMTC ORR</text>
  </g>

  <!-- Bottom-Right Live Shortcut Callout -->
  <g transform="translate(888, 228)">
    <rect x="0" y="0" width="286" height="118" rx="14" fill="#0F172A" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.55" />
    <text x="16" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="0.6">OPTIMAL MULTI-MODAL PATH</text>
    <text x="16" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Silk Board -&gt; Whitefield</text>
    <text x="16" y="71" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#CBD5E1">1. BMTC 500-D (ORR) -&gt; KR Puram</text>
    <text x="16" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#CBD5E1">2. Skywalk -&gt; Purple Line East</text>
    <text x="16" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#34D399">46 mins  |  Rs. 55  |  Saves 25 mins</text>
  </g>
</svg>
