<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Bengaluru TransitConnect v2.5 Smooth Pro Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="52%" stop-color="#102C57" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="gridDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#93C5FD" fill-opacity="0.16" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="22" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="22" fill="url(#gridDots)" />

  <!-- Subtle glowing transit arcs on right -->
  <path d="M 740 310 C 830 220, 930 240, 1140 105" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-opacity="0.45" stroke-linecap="round" />
  <path d="M 770 335 C 885 260, 980 265, 1165 165" fill="none" stroke="#10B981" stroke-width="5" stroke-opacity="0.45" stroke-linecap="round" />
  <path d="M 710 285 C 830 190, 955 185, 1125 65" fill="none" stroke="#FACC15" stroke-width="4" stroke-dasharray="10 8" stroke-opacity="0.55" stroke-linecap="round" />

  <!-- Top Pill Badge -->
  <rect x="56" y="38" width="432" height="30" rx="15" fill="#1E3A8A" stroke="#60A5FA" stroke-opacity="0.5" />
  <circle cx="76" cy="53" r="5" fill="#34D399" />
  <text x="90" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#DBEAFE" letter-spacing="0.8">
    BMTC BUS + NAMMA METRO  |  MYSQL 8 (3NF)  |  SPRING BOOT 3 + REACT
  </text>

  <!-- Main Title -->
  <text x="56" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
    Bengaluru TransitConnect
  </text>
  <rect x="615" y="84" width="146" height="34" rx="10" fill="#2563EB" stroke="#93C5FD" stroke-opacity="0.7" />
  <text x="688" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">
    v2.5 Smooth Pro
  </text>

  <!-- Subtitle -->
  <text x="56" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#BFDBFE">
    Door-to-Door Multi-Modal Route Optimizer, Short-Auth ACID Smart Wallet &amp; Live DBMS Studio
  </text>

  <!-- Accent Multi-Modal Line Bar -->
  <rect x="56" y="176" width="680" height="5" rx="2.5" fill="url(#accentLine)" />

  <!-- 4 Bottom Metric Glass Cards -->
  <g transform="translate(56, 206)">
    <rect x="0" y="0" width="252" height="108" rx="16" fill="url(#cardGlass)" stroke="#93C5FD" stroke-opacity="0.28" />
    <text x="20" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="0.8">NORMALIZED 3NF SCHEMA</text>
    <text x="20" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">20 SQL Tables</text>
    <text x="20" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#CBD5E1">211 Attributes  |  93 Constraints</text>

    <rect x="270" y="0" width="252" height="108" rx="16" fill="url(#cardGlass)" stroke="#6EE7B7" stroke-opacity="0.28" />
    <text x="290" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">DOOR-TO-DOOR GRAPH</text>
    <text x="290" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">300+ Places</text>
    <text x="290" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#CBD5E1">76 Transit Nodes  |  &lt;=10m Walk Cap</text>

    <rect x="540" y="0" width="252" height="108" rx="16" fill="url(#cardGlass)" stroke="#FDE047" stroke-opacity="0.28" />
    <text x="560" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#FDE047" letter-spacing="0.8">DBMS PROGRAMMABILITY</text>
    <text x="560" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">4 Views + 5 Trg</text>
    <text x="560" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#CBD5E1">3 Stored Procs  |  ACID FOR UPDATE</text>

    <rect x="810" y="0" width="278" height="108" rx="16" fill="url(#cardGlass)" stroke="#C4B5FD" stroke-opacity="0.32" />
    <text x="830" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#DDD6FE" letter-spacing="0.8">VERIFIED QUALITY SUITE</text>
    <text x="830" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#34D399">15 / 15 Passing</text>
    <text x="830" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#CBD5E1">7/7 Indexed EXPLAIN  |  0 Full Scans</text>
  </g>

  <!-- Right Floating Route Pill Preview -->
  <g transform="translate(815, 42)">
    <rect x="0" y="0" width="328" height="132" rx="16" fill="#0F172A" fill-opacity="0.82" stroke="#60A5FA" stroke-opacity="0.4" />
    <text x="18" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" letter-spacing="0.7">LIVE MULTI-MODAL SHORTCUT</text>
    <text x="18" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Silk Board  -&gt;  Whitefield (Kadugodi)</text>

    <rect x="18" y="66" width="84" height="24" rx="6" fill="#2563EB" />
    <text x="60" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">BMTC 500-D</text>

    <text x="111" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">-&gt;</text>

    <rect x="130" y="66" width="76" height="24" rx="6" fill="#0D9488" />
    <text x="168" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">KR Puram</text>

    <text x="215" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">-&gt;</text>

    <rect x="234" y="66" width="76" height="24" rx="6" fill="#7C3AED" />
    <text x="272" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Purple Line</text>

    <text x="18" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399">46 mins  |  Rs. 55.00  |  Saves 25 mins</text>
  </g>
</svg>
